spring:
  application:
    name: agentflow-worker
  data:
    redis:
      host: localhost
      port: 6379
  lifecycle:
    timeout-per-shutdown-phase: 30s
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: agentflow-worker-consumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      max-poll-records: 1
      properties:
        spring.json.trusted.packages: com.agentflow.common.mq,com.agentflow.common.trace
        max.poll.interval.ms: 600000
    listener:
      immediate-stop: false
      concurrency: 4          # 2 worker × 4 = 8 线程,对应 SUBTASK 的 8 个分区

server:
  shutdown: graceful

# LLM 网关:默认 mock(不烧钱、无需 key);切真模型设 llm.provider=openai + OPENAI_* 环境变量。
llm:
  provider: mock
  default-model: mock-small
  # mock 每次调用的模拟耗时(ms):docker compose 里设 1500,便于在页面看清每一步、演示杀 worker
  mock:
    delay-ms: 0
  models:
    - name: mock-small        # 便宜/高频模型:桶大、便宜
      capacity: 20
      refill-per-sec: 10
      price-per1k-tokens: 0.0005
    - name: mock-large        # 贵/低频模型:桶小、限流更严、更贵
      capacity: 5
      refill-per-sec: 2
      price-per1k-tokens: 0.01
    - name: ${LLM_MODEL:mock-small}   # 真实模型(.env 的 LLM_MODEL);未设置时与 mock-small 同名,不生效
      capacity: 10
      refill-per-sec: 2
      price-per1k-tokens: ${LLM_PRICE_PER1K:0.001}

# RAG 检索服务(Python/FastAPI + pgvector)
rag:
  base-url: http://localhost:8000
  top-k: 3
  timeout-ms: 3000

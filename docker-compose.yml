services:
  mysql:
    image: mysql:8.0
    container_name: agentflow-mysql
    environment:
      MYSQL_ROOT_PASSWORD: agentflow123
      MYSQL_DATABASE: agentflow
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pagentflow123"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7.2-alpine
    container_name: agentflow-redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  mongo:
    image: mongo:7
    container_name: agentflow-mongo
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 20

  kafka:
    image: apache/kafka:4.0.0        # 官方镜像,原生 KRaft,无需 Zookeeper;arm64 支持
    container_name: agentflow-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      # 单节点 KRaft:同一进程既是 broker 又是 controller
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # 容器内(server/worker)连 kafka:19092;宿主机(本地开发、测试)连 localhost:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"   # W1-2 允许自动建 topic;topic 也会由 NewTopic bean 显式声明
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      retries: 30

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: agentflow-pgvector
    ports: ["127.0.0.1:5433:5432"]
    environment:
      POSTGRES_PASSWORD: agentflow
      POSTGRES_DB: agentflow_rag
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 20

  rag:
    build: ./agentflow-rag
    container_name: agentflow-rag
    environment:
      RAG_DB_URL: postgresql://postgres:agentflow@pgvector:5432/agentflow_rag
    ports: ["127.0.0.1:${RAG_PORT:-8000}:8000"]
    depends_on:
      pgvector: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 20

  server:
    build: {context: ., dockerfile: docker/java.Dockerfile, args: {MODULE: agentflow-server}}
    container_name: agentflow-server
    ports: ["${SERVER_BIND:-127.0.0.1}:8080:8080"]
    environment:
      DEMO_ACCESS_CODE: ${DEMO_ACCESS_CODE:-}
      DEMO_PER_IP_DAILY: ${DEMO_PER_IP_DAILY:-5}
      DEMO_DAILY_BUDGET_USD: ${DEMO_DAILY_BUDGET_USD:-1.0}
      DEMO_TRUST_PROXY_HEADER: ${DEMO_TRUST_PROXY_HEADER:-false}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/agentflow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/agentflow_trace
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      mongo: {condition: service_healthy}
      kafka: {condition: service_healthy}

  worker-1: &worker
    build: {context: ., dockerfile: docker/java.Dockerfile, args: {MODULE: agentflow-worker}}
    container_name: agentflow-worker-1
    hostname: worker-1          # 页面上显示的 workerId;chaos 脚本据此 docker kill
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SPRING_DATA_REDIS_HOST: redis
      RAG_BASEURL: http://rag:8000
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_DEFAULTMODEL: ${LLM_MODEL:-mock-small}
      LLM_MODEL: ${LLM_MODEL:-mock-small}
      LLM_PRICE_PER1K: ${LLM_PRICE_PER1K:-0.001}
      LLM_MOCK_DELAYMS: ${LLM_MOCK_DELAY_MS:-1500}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EXTRA_BODY: ${OPENAI_EXTRA_BODY:-}
      OPENAI_MAX_TOKENS_PARAM: ${OPENAI_MAX_TOKENS_PARAM:-max_tokens}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    depends_on:
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
      rag: {condition: service_healthy}
      server: {condition: service_started}

  worker-2:
    <<: *worker
    container_name: agentflow-worker-2
    hostname: worker-2

volumes:
  mysql-data:

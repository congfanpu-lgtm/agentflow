<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentFlow 课程库</title>
<style>
  :root{--ink:#16191d;--body:#2c313a;--t2:#58606c;--dim:#8a919b;--line:#e3e6ea;--wash:#f5f6f8;
    --blue:#14467c;--run:#dfe8f3;--err:#b3261e;--errbg:#fbe9e7;--ok:#14884a;--okbg:#e4f3ea}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:#fff;color:var(--ink);
    font:14px/1.6 -apple-system,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif}
  a{color:var(--blue);text-decoration:none} a:hover{text-decoration:underline}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
  h1{margin:0;font-size:22px;font-weight:700}
  h2{margin:0 0 10px;font-size:12.5px;font-weight:600;color:var(--t2)}
  input{font:inherit;height:32px;border:1px solid #c5cad2;border-radius:3px;padding:0 10px;background:#fff;color:var(--ink)}
  input:focus{outline:2px solid var(--blue);outline-offset:-1px}
  .btn{height:32px;padding:0 16px;border-radius:3px;border:1px solid var(--ink);background:var(--ink);color:#fff;white-space:nowrap}
  .btn.ghost{height:26px;padding:0 10px;background:#fff;color:var(--ink);border-color:#c5cad2;font-size:12.5px}
  .btn:disabled{opacity:.45;cursor:default}
  .num{font-variant-numeric:tabular-nums}
  .dim{color:var(--dim)}
  .msg{min-height:20px;margin-top:8px;font-size:12.5px;color:var(--err)}

  .frame{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
  .rail{background:var(--wash);border-right:1px solid var(--line);padding:22px 0 18px}
  .brand{font-weight:700;font-size:16px;padding:0 20px 20px}
  .rail h2{padding:0 20px}
  .rail nav button{display:flex;width:100%;justify-content:space-between;gap:10px;padding:9px 20px 9px 17px;color:var(--t2);border-left:3px solid transparent}
  .rail nav button:hover{color:var(--ink)}
  .rail nav button.on{color:var(--ink);font-weight:600;border-left-color:var(--blue);background:#fff}
  .rail nav i{font-style:normal;font-weight:400;font-size:12px;color:var(--dim);white-space:nowrap}
  .rail form{padding:16px 20px 0;display:grid;gap:8px}
  main{max-width:1180px;padding:26px 36px 56px}
  .add{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,1.4fr) auto;gap:8px;margin:18px 0 0}
  .hint{margin:6px 0 22px;font-size:12.5px;color:var(--dim)}

  table{width:100%;border-collapse:collapse}
  th{font-weight:600;font-size:12.5px;color:var(--t2);text-align:left;padding:8px 10px 8px 0;border-bottom:1px solid var(--line)}
  td{padding:10px 10px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}
  td.t{max-width:380px;overflow-wrap:anywhere}
  .st{font-weight:600;white-space:nowrap}
  .st.READY{color:var(--ok)} .st.FAILED{color:var(--err)} .st.PARTIAL{color:#8a5a00} .st.INGESTING{color:var(--blue)}
  .chips{display:flex;gap:4px;flex-wrap:wrap}
  .chip{font-size:12px;line-height:20px;padding:0 7px;border-radius:3px;background:var(--wash);color:var(--dim);white-space:nowrap}
  .chip.run{background:var(--run);color:var(--blue)}
  .chip.ok{background:var(--okbg);color:var(--ok)}
  .chip.bad{background:var(--errbg);color:var(--err)}
  .why{margin-top:6px;font-size:12.5px;color:var(--err);overflow-wrap:anywhere}
  .off{max-width:560px;margin:18vh auto;padding:0 28px;color:var(--t2)}
</style>
</head>
<body>
<div id="off" class="off" hidden>课程功能没有开启（<code>agentflow.course.enabled</code>）。</div>
<div id="app" class="frame" hidden>
  <aside class="rail">
    <div class="brand">AgentFlow 课程库</div>
    <h2>课程</h2>
    <nav id="courses"></nav>
    <form id="newCourse">
      <input id="courseName" placeholder="新课程的名字" maxlength="200" autocomplete="off">
      <button class="btn" type="submit">新建课程</button>
      <div class="msg" id="courseMsg"></div>
    </form>
  </aside>
  <main>
    <div id="empty" class="dim">先在左边新建一门课。</div>
    <div id="course" hidden>
      <h1 id="title"></h1>
      <form id="newLecture" class="add">
        <input id="source" placeholder="YouTube 链接，或者媒体服务 inbox 目录里的文件名" autocomplete="off">
        <input id="lectureTitle" placeholder="标题（可不填）" maxlength="300" autocomplete="off">
        <button class="btn" type="submit">添加一讲</button>
      </form>
      <div class="msg" id="lectureMsg"></div>
      <div class="hint">添加后依次：导入 → 转写 ∥ 截帧 → 建索引 → 知识点目录。每一步是 AgentFlow 的一个子任务，失败会自动重试。</div>
      <table>
        <thead><tr><th>#</th><th>标题</th><th>时长</th><th>状态</th><th>步骤（成功的显示用时）</th><th></th></tr></thead>
        <tbody id="lectures"></tbody>
      </table>
    </div>
  </main>
</div>
<script>
const $ = s => document.querySelector(s);
function el(tag, cls, text) {           // 所有外来文字都走 textContent
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
const STEPS = [["LEC_IMPORT", "导入"], ["LEC_TRANSCRIBE", "转写"], ["LEC_FRAMES", "截帧"], ["LEC_INDEX", "索引"], ["LEC_CONCEPTS", "知识点"]];
const STATUS = {INGESTING: "处理中", READY: "已完成", PARTIAL: "部分完成", FAILED: "失败"};
let current = Number(new URLSearchParams(location.hash.slice(1)).get("c")) || null;
let timer = null;

async function api(path, opts) {
  const r = await fetch("/api/v1" + path, opts);
  const data = await r.json().catch(() => null);
  if (!r.ok) {
    const e = new Error((data && data.error) || ("请求失败（HTTP " + r.status + "）"));
    e.status = r.status;
    throw e;
  }
  return data;
}
const post = (path, body) => api(path, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body || {})});

function clock(ms) {
  if (ms == null) return "";
  const s = Math.round(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s % 60).padStart(2, "0");
}

async function loadCourses() {
  let list;
  try {
    list = await api("/courses");
  } catch (e) {
    if (e.status === 404) { $("#off").hidden = false; return; }
    throw e;
  }
  $("#app").hidden = false;
  if (!list.some(c => c.id === current)) current = list.length ? list[0].id : null;
  const nav = $("#courses");
  nav.replaceChildren();
  for (const c of list) {
    const b = el("button", c.id === current ? "on" : "");
    b.append(el("span", null, c.name), el("i", "num", c.ready + " / " + c.lectures + " 讲"));
    b.onclick = () => { current = c.id; location.hash = "c=" + c.id; loadCourses(); };
    nav.append(b);
  }
  $("#empty").hidden = current != null;
  $("#course").hidden = current == null;
  if (current != null) await loadCourse();
}

async function loadCourse() {
  clearTimeout(timer);
  const id = current;
  const c = await api("/courses/" + id);
  if (id !== current) return;            // 请求在路上时用户切到了别的课
  $("#title").textContent = c.name;
  const body = $("#lectures");
  body.replaceChildren();
  for (const l of c.lectures) body.append(row(l));
  if (!c.lectures.length) {
    const tr = el("tr"), td = el("td", "dim", "这门课还没有讲次。");
    td.colSpan = 6;
    tr.append(td);
    body.append(tr);
  }
  if (c.lectures.some(l => l.status === "INGESTING")) timer = setTimeout(() => loadCourse().catch(() => {}), 3000);
}

function row(l) {
  const tr = el("tr");
  tr.append(el("td", "num dim", String(l.seq)));
  const t = el("td", "t");
  const name = l.title || l.sourceUrl || l.sourcePath;
  if (l.status === "READY" || l.status === "PARTIAL") {
    const a = el("a", null, name);
    a.href = "lecture.html?id=" + l.id;
    t.append(a);
  } else {
    t.append(el("span", null, name));
  }
  if (l.error) t.append(el("div", "why", l.error));
  tr.append(t, el("td", "num", clock(l.durationMs)), el("td", "st " + l.status, STATUS[l.status] || l.status));

  const chips = el("div", "chips");
  for (const [kind, label] of STEPS) {
    const s = l.stages.find(x => x.kind === kind);
    let cls = "chip", text = label;
    if (s && s.status === "COMPLETED") { cls += " ok"; text += " " + s.seconds + "s"; }
    else if (s && s.status === "FAILED") cls += " bad";
    else if (s) cls += " run";
    const chip = el("span", cls, text);
    if (s && s.error) chip.title = s.error;
    chips.append(chip);
  }
  const steps = el("td");
  steps.append(chips);
  tr.append(steps);

  const act = el("td");
  if (l.status === "FAILED" || l.status === "PARTIAL") {
    const b = el("button", "btn ghost", "重试");
    b.onclick = async () => {
      b.disabled = true;
      try { await post("/lectures/" + l.id + "/retry"); } catch (e) { $("#lectureMsg").textContent = e.message; }
      loadCourses();
    };
    act.append(b);
  }
  tr.append(act);
  return tr;
}

$("#newCourse").onsubmit = async e => {
  e.preventDefault();
  $("#courseMsg").textContent = "";
  try {
    const c = await post("/courses", {name: $("#courseName").value});
    $("#courseName").value = "";
    current = c.id;
    location.hash = "c=" + c.id;
    await loadCourses();
  } catch (err) { $("#courseMsg").textContent = err.message; }
};

$("#newLecture").onsubmit = async e => {
  e.preventDefault();
  $("#lectureMsg").textContent = "";
  const source = $("#source").value.trim();
  const body = /^https?:\/\//i.test(source) ? {url: source} : {path: source};
  if ($("#lectureTitle").value.trim()) body.title = $("#lectureTitle").value.trim();
  try {
    await post("/courses/" + current + "/lectures", body);
    $("#source").value = $("#lectureTitle").value = "";
  } catch (err) { $("#lectureMsg").textContent = err.message; }
  loadCourses();
};

loadCourses().catch(e => { $("#app").hidden = false; $("#courseMsg").textContent = e.message; });
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>AgentFlow 简报</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#fff; --panel2:#f3f4f7; --border:#e3e6eb; --border2:#cfd4dc;
    --fg:#12161d; --fg2:#3b4350; --muted:#6b7482; --accent:#2457d6; --btn:#2457d6; --accent-soft:#e8eefc;
    --ok:#1a7f37; --warn:#9a6700; --fail:#cf222e; --warn-soft:#fdf3dc; --fail-soft:#fde8e8;
    --shadow:0 1px 2px rgba(16,24,40,.06);
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0d1117; --panel:#151b24; --panel2:#1c232f; --border:#262e3b; --border2:#364152;
      --fg:#e6edf3; --fg2:#c3ccd8; --muted:#8892a2; --accent:#6aa5ff; --btn:#2f6fe0; --accent-soft:rgba(106,165,255,.14);
      --ok:#3fb950; --warn:#e3a33b; --fail:#f2615a; --warn-soft:rgba(227,163,59,.15); --fail-soft:rgba(242,97,90,.15);
      --shadow:none;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
  a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
  [hidden]{display:none!important}
  .muted{color:var(--muted)}

  header{background:var(--panel);border-bottom:1px solid var(--border)}
  header .in{max-width:1080px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:12px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;white-space:nowrap}
  .logo{width:26px;height:26px;border-radius:7px;background:var(--btn);display:grid;place-items:center;font-size:14px;color:#fff}
  .who{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;min-width:0}
  .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  main{max-width:1080px;margin:0 auto;padding:28px 20px 56px}
  h1{font-size:26px;line-height:1.3;margin:0;letter-spacing:-.2px}
  h2{font-size:15px;margin:0 0 12px}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px;box-shadow:var(--shadow)}

  button{font:inherit;cursor:pointer}
  .btn{background:var(--btn);color:#fff;border:0;border-radius:9px;padding:9px 16px;font-weight:600;white-space:nowrap}
  .btn:hover{filter:brightness(1.08)} .btn:disabled{opacity:.5;cursor:default}
  .ghost{background:transparent;border:1px solid var(--border2);color:var(--fg2);border-radius:9px;padding:8px 14px;white-space:nowrap}
  .ghost:hover{color:var(--fg);border-color:var(--muted)} .ghost:disabled{opacity:.5;cursor:default}
  .ghost.small{padding:4px 10px;font-size:12.5px;border-radius:7px}
  input,select{width:100%;background:var(--panel);border:1px solid var(--border2);color:var(--fg);
    border-radius:9px;padding:9px 12px;font:inherit}
  input:focus,select:focus,button:focus-visible,summary:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  label{display:block;font-size:13px;color:var(--fg2);margin:12px 0 5px}
  .row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
  .row > .grow{flex:1 1 120px;min-width:0}
  .msg{font-size:13px;color:var(--muted)} .msg:not(:empty){margin-top:10px}
  .msg.err{color:var(--fail)} .msg.ok{color:var(--ok)}

  /* 登录:左边一句话说清是什么,右边表单 */
  #auth{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:48px;align-items:center;max-width:900px;margin:8vh auto 0}
  #auth h1{font-size:34px}
  #auth p{color:var(--fg2);font-size:16px;margin:12px 0 18px}
  #auth ul{list-style:none;padding:0;margin:0;color:var(--fg2)}
  #auth li{padding-left:24px;position:relative;margin-bottom:8px}
  #auth li::before{content:"✓";position:absolute;left:0;color:var(--ok);font-weight:700}
  #auth label:first-child{margin-top:0}

  /* 登录后:简报是主角,自选股和推送设置放右边 */
  .layout{display:grid;gap:20px;align-items:start;grid-template-columns:minmax(0,1fr) 320px;
    grid-template-areas:"feed watch" "feed push";grid-template-rows:auto 1fr}
  .feed{grid-area:feed;min-width:0} .watch{grid-area:watch} .push{grid-area:push}
  .feedhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:6px}
  .feedhead .sub{color:var(--muted);font-size:13.5px;margin-top:4px}
  @media (max-width:820px){
    .layout{grid-template-columns:minmax(0,1fr);grid-template-areas:"watch" "feed" "push";grid-template-rows:auto}
    #auth{grid-template-columns:minmax(0,1fr);gap:22px;margin-top:2vh} #auth h1{font-size:28px}
    main{padding:20px 16px 48px} header .in{padding:12px 16px}
  }

  /* 自选股 */
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .chip{display:inline-flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--border);
    border-radius:999px;padding:3px 5px 3px 12px;font-size:13px;max-width:100%}
  .chip b{font-family:var(--mono);font-size:12.5px}
  .chip span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
  .chip button{background:transparent;border:0;color:var(--muted);width:22px;height:22px;border-radius:50%;font-size:15px;line-height:1}
  .chip button:hover{background:var(--border2);color:var(--fg)}

  /* 简报 */
  .day{font-size:13px;font-weight:600;color:var(--fg2);margin:22px 0 10px}
  .event{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--border2);border-radius:12px;
    padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow)}
  .event.i3{border-left-color:var(--fail)} .event.i2{border-left-color:var(--warn)}
  .event .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;font-size:12.5px}
  .tk{font-family:var(--mono);font-weight:700;color:var(--accent);background:var(--accent-soft);padding:1px 8px;border-radius:6px}
  .tag{padding:1px 8px;border-radius:999px;background:var(--panel2);color:var(--fg2)}
  .tag.hot{background:var(--fail-soft);color:var(--fail)} .tag.warm{background:var(--warn-soft);color:var(--warn)}
  .event .when{margin-left:auto;color:var(--muted)}
  .event h3{font-size:17px;font-weight:650;margin:0 0 6px;line-height:1.45;overflow-wrap:anywhere}
  .event p{margin:0;color:var(--fg2);overflow-wrap:anywhere}
  .event blockquote{margin:10px 0 0;padding:2px 12px;border-left:2px solid var(--border2);color:var(--muted);font-size:13.5px;overflow-wrap:anywhere}
  .event .src{margin-top:10px;font-size:13px;overflow-wrap:anywhere}
  .empty{background:var(--panel);border:1px dashed var(--border2);border-radius:12px;color:var(--muted);text-align:center;padding:40px 20px;margin-top:16px}
  .empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:6px}

  /* 推送设置:默认收起,只露出当前状态 */
  summary{cursor:pointer;font-weight:600;border-radius:6px}
  summary .state{float:right;font-weight:400;font-size:12.5px;color:var(--muted);background:var(--panel2);padding:1px 9px;border-radius:999px}
  summary .state.on{color:var(--ok)}
  details .hint{font-size:13px;color:var(--muted);margin-top:12px}
  footer{color:var(--muted);font-size:12.5px;text-align:center;margin-top:36px}
</style>
</head>
<body>
<header><div class="in">
  <div class="brand"><div class="logo" aria-hidden="true">A</div>AgentFlow 简报</div>
  <div class="who" id="who" hidden><span id="whoEmail"></span><button class="ghost small" id="logout" type="button">退出</button></div>
</div></header>

<main>
  <!-- 未登录 -->
  <section id="auth" hidden>
    <div>
      <h1>你关注的股票,<br>每天发生了什么</h1>
      <p>选好你关注的美股,每天自动整理它们的公司公告和新闻。</p>
      <ul>
        <li>每条都带出处链接,可以点进去核对原文</li>
        <li>在这个页面看,或者推送到你自己的 Slack / 飞书</li>
        <li>只整理发生了什么,不给买卖建议</li>
      </ul>
    </div>
    <form class="panel" id="authForm">
      <label for="email">邮箱</label>
      <input id="email" type="email" autocomplete="email" required>
      <label for="password">密码(至少 8 位)</label>
      <input id="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required>
      <div class="row" style="margin-top:16px">
        <button class="btn" type="submit" id="loginBtn">登录</button>
        <button class="ghost" type="button" id="registerBtn">注册新账号</button>
      </div>
      <div class="msg" id="authMsg" role="status" aria-live="polite"></div>
    </form>
  </section>

  <!-- 已登录 -->
  <div id="app" class="layout" hidden>
    <section class="feed">
      <div class="feedhead">
        <div>
          <h1>我的简报</h1>
          <div class="sub" id="feedSub"></div>
        </div>
        <button class="ghost small" type="button" id="refresh">刷新</button>
      </div>
      <div id="events" aria-live="polite"></div>
    </section>

    <section class="panel watch">
      <h2>自选股</h2>
      <div class="chips" id="chips"></div>
      <form class="row" id="addForm">
        <div class="grow">
          <input id="ticker" aria-label="美股代码" placeholder="美股代码,例如 AAPL" maxlength="8" autocomplete="off" autocapitalize="characters" required>
        </div>
        <button class="btn" type="submit">添加</button>
      </form>
      <div class="msg" id="watchMsg" role="status" aria-live="polite"></div>
    </section>

    <details class="panel push">
      <summary>推送到 Slack / 飞书 <span class="state" id="pushState"></span></summary>
      <div class="hint">可选。不设置也能一直在这个页面看;设置后每天到点把新内容发到你的群里。</div>
      <form id="settingsForm">
        <label for="webhook">机器人 Webhook 地址 <span class="muted" id="webhookNow"></span></label>
        <input id="webhook" type="url" autocomplete="off" placeholder="https://hooks.slack.com/… 或飞书机器人地址">
        <div class="row">
          <div class="grow">
            <label for="pushHour">每天几点推送</label>
            <select id="pushHour"></select>
          </div>
          <div class="grow">
            <label for="timezone">时区</label>
            <select id="timezone"></select>
          </div>
        </div>
        <div class="row" style="margin-top:16px">
          <button class="btn" type="submit">保存</button>
          <button class="ghost" type="button" id="testBtn">发一条测试消息</button>
          <button class="ghost" type="button" id="clearBtn">停止推送</button>
        </div>
        <div class="msg" id="settingsMsg" role="status" aria-live="polite"></div>
      </form>
    </details>
  </div>

  <footer>内容由 AI 根据公开的公司公告和新闻整理,可能有错漏,请以原文为准。<br>仅为信息整理,不构成投资建议。</footer>
</main>

<script>
'use strict';
const $ = id => document.getElementById(id);

// 所有来自服务器的文字都走 textContent,不拼 HTML:标题、摘要里即使混进了标签也只会显示成普通文字
function el(tag, attrs, ...children) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') n.className = v; else if (k === 'text') n.textContent = v; else n.setAttribute(k, v);
  }
  for (const c of children) if (c) n.append(c);
  return n;
}

async function api(method, path, body) {
  const r = await fetch('/api/v1' + path, {
    method, credentials: 'same-origin',
    headers: body ? {'Content-Type': 'application/json'} : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = null;
  try { data = await r.json(); } catch (e) { /* 没有响应体 */ }
  if (!r.ok) {
    const err = new Error((data && data.error) || ('请求失败(' + r.status + ')'));
    err.status = r.status;
    throw err;
  }
  return data;
}

function say(id, text, kind) {
  const m = $(id);
  m.textContent = text || '';
  m.className = 'msg' + (kind ? ' ' + kind : '');
}

// 登录过期时回到登录页;其他错误显示在对应区域
function fail(id, e) {
  if (e.status === 401) { showAuth(); return; }
  say(id, e.message, 'err');
}

function showAuth() {
  $('app').hidden = true; $('who').hidden = true; $('auth').hidden = false;
  pollUntil = 0;
}

// ---------- 登录 / 注册 ----------
async function authenticate(action) {
  const form = $('authForm');
  if (!form.reportValidity()) return;
  say('authMsg', action === 'register' ? '正在注册…' : '正在登录…');
  try {
    await api('POST', '/auth/' + action, {email: $('email').value, password: $('password').value});
    $('password').value = '';
    say('authMsg', '');
    await start();
  } catch (e) {
    say('authMsg', e.message, 'err');
  }
}
$('authForm').addEventListener('submit', e => { e.preventDefault(); authenticate('login'); });
$('registerBtn').addEventListener('click', () => authenticate('register'));
$('logout').addEventListener('click', async () => {
  try { await api('POST', '/auth/logout'); } catch (e) { /* 反正要回登录页 */ }
  showAuth();
});

// ---------- 自选股 ----------
async function loadWatchlist() {
  const list = await api('GET', '/me/watchlist');
  const chips = $('chips');
  chips.replaceChildren();
  watchCount = list.length;
  if (!list.length) chips.append(el('span', {class: 'muted', text: '还没有关注任何股票,先加一只。'}));
  for (const w of list) {
    const remove = el('button', {type: 'button', 'aria-label': '取消关注 ' + w.ticker, text: '×'});
    remove.addEventListener('click', async () => {
      try {
        await api('DELETE', '/me/watchlist?ticker=' + encodeURIComponent(w.ticker));
        say('watchMsg', '已取消关注 ' + w.ticker);
        await loadWatchlist();
        await loadEvents();
      } catch (e) { fail('watchMsg', e); }
    });
    chips.append(el('span', {class: 'chip'}, el('b', {text: w.ticker}),
      w.companyName && w.companyName !== w.ticker ? el('span', {text: w.companyName}) : null, remove));
  }
  return list;
}

$('addForm').addEventListener('submit', async e => {
  e.preventDefault();
  const input = $('ticker');
  try {
    const added = await api('POST', '/me/watchlist', {ticker: input.value});
    input.value = '';
    say('watchMsg', '已关注 ' + added.ticker + '。正在整理它的第一份简报,大约一分钟后出现。', 'ok');
    await loadWatchlist();
    await loadEvents();
    pollUntil = Date.now() + 3 * 60 * 1000;   // 接下来 3 分钟自动刷新,等第一份简报
  } catch (e) { fail('watchMsg', e); }
});

// ---------- 简报 ----------
let pollUntil = 0;
let watchCount = 0;

// 简报按美东日期归档,“今天 / 昨天”也按美东算
function dayLabel(d) {
  if (!/^\d{4}-\d\d-\d\d$/.test(d)) return d;
  const [, m, dd] = d.split('-').map(Number);
  const today = new Intl.DateTimeFormat('en-CA', {timeZone: 'America/New_York'}).format(new Date());
  const ago = Math.round((Date.parse(today) - Date.parse(d)) / 864e5);
  const week = '日一二三四五六'[new Date(d + 'T00:00:00Z').getUTCDay()];
  return (ago === 0 ? '今天 · ' : ago === 1 ? '昨天 · ' : '') + m + '月' + dd + '日 周' + week;
}

function eventCard(ev) {
  // 普通事件不打标签,只有“重要 / 值得看”才标出来
  const top = el('div', {class: 'top'}, el('span', {class: 'tk', text: ev.ticker}),
    ev.importance >= 3 ? el('span', {class: 'tag hot', text: '重要'}) : null,
    ev.importance === 2 ? el('span', {class: 'tag warm', text: '值得看'}) : null,
    ev.form ? el('span', {class: 'tag', text: 'SEC ' + ev.form}) : null,
    ev.eventDate ? el('span', {class: 'when', text: ev.eventDate}) : null);
  const card = el('article', {class: 'event i' + ev.importance}, top,
    el('h3', {text: ev.title}), el('p', {text: ev.summary}),
    ev.quote ? el('blockquote', {text: '原文:' + ev.quote}) : null);
  // 只给 http(s) 链接;别的协议(javascript: 之类)一律当文字显示
  if (/^https?:\/\//i.test(ev.url || '')) {
    let host = '';
    try { host = new URL(ev.url).hostname; } catch (e) { /* 留空 */ }
    // 出处标题和事件标题一样时不重复写一遍
    const name = ev.sourceTitle && ev.sourceTitle !== ev.title ? ev.sourceTitle : '查看原文';
    const a = el('a', {href: ev.url, target: '_blank', rel: 'noopener noreferrer', text: name + ' ↗'});
    card.append(el('div', {class: 'src'}, a, host ? el('span', {class: 'muted', text: ' · ' + host}) : null));
  }
  return card;
}

async function loadEvents() {
  const events = await api('GET', '/me/events?days=7');
  const box = $('events');
  box.replaceChildren();
  $('feedSub').textContent = '关注 ' + watchCount + ' 只 · 最近 7 天 ' + events.length + ' 条 · 每天美东 7:00 和 18:00 更新';
  if (!events.length) {
    box.append(watchCount
      ? el('div', {class: 'empty'}, el('b', {text: '这几天没有新动态'}),
          '新关注的股票大约一分钟后会有第一份简报。没有重要动态的日子不会有内容。')
      : el('div', {class: 'empty'}, el('b', {text: '先加一只自选股'}),
          '加上之后,这里每天会出现它的公司公告和新闻。'));
    return;
  }
  let day = null;
  for (const ev of events) {
    if (ev.date !== day) { day = ev.date; box.append(el('div', {class: 'day', text: dayLabel(day)})); }
    box.append(eventCard(ev));
  }
}
$('refresh').addEventListener('click', () => loadEvents().catch(e => fail('watchMsg', e)));
setInterval(() => { if (Date.now() < pollUntil) loadEvents().catch(() => {}); }, 5000);

// ---------- 推送设置 ----------
const ZONES = ['Asia/Shanghai', 'Asia/Hong_Kong', 'Asia/Singapore', 'Asia/Tokyo', 'America/New_York',
  'America/Chicago', 'America/Los_Angeles', 'Europe/London', 'Australia/Sydney'];

function fillSettings(me) {
  const hour = $('pushHour');
  hour.replaceChildren();
  for (let h = 0; h < 24; h++) hour.append(el('option', {value: String(h), text: String(h).padStart(2, '0') + ':00'}));
  hour.value = String(me.pushHour);

  let browserZone = '';
  try { browserZone = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) { /* 老浏览器 */ }
  const zone = $('timezone');
  zone.replaceChildren();
  for (const z of [...new Set([me.timezone, browserZone, ...ZONES].filter(Boolean))]) {
    zone.append(el('option', {value: z, text: z === browserZone ? z + '(你现在所在的时区)' : z}));
  }
  zone.value = me.timezone;

  $('pushState').textContent = me.webhook ? '每天 ' + String(me.pushHour).padStart(2, '0') + ':00' : '未开启';
  $('pushState').className = 'state' + (me.webhook ? ' on' : '');
  $('webhookNow').textContent = me.webhook ? '当前:' + me.webhook + '(留空 = 不改)' : '当前:未设置';
  $('webhook').value = '';
  $('testBtn').disabled = $('clearBtn').disabled = !me.webhook;
}

async function saveSettings(extra, done) {
  const body = Object.assign({pushHour: Number($('pushHour').value), timezone: $('timezone').value}, extra);
  try {
    await api('PUT', '/me/settings', body);
    fillSettings(await api('GET', '/me'));
    say('settingsMsg', done, 'ok');
  } catch (e) { fail('settingsMsg', e); }
}
$('settingsForm').addEventListener('submit', e => {
  e.preventDefault();
  const url = $('webhook').value.trim();
  saveSettings(url ? {webhookUrl: url} : {}, '已保存。');
});
$('clearBtn').addEventListener('click', () => saveSettings({webhookUrl: ''}, '已停止推送,简报仍可在这个页面看。'));
$('testBtn').addEventListener('click', async () => {
  say('settingsMsg', '正在发送…');
  try {
    await api('POST', '/me/webhook-test');
    say('settingsMsg', '已发送,去群里看看有没有收到。', 'ok');
  } catch (e) { fail('settingsMsg', e); }
});

// ---------- 启动 ----------
async function start() {
  let me;
  try {
    me = await api('GET', '/me');
  } catch (e) {
    showAuth();
    if (e.status !== 401) say('authMsg', e.message, 'err');
    return;
  }
  $('auth').hidden = true; $('app').hidden = false; $('who').hidden = false;
  $('whoEmail').textContent = me.email;
  fillSettings(me);
  try {
    await loadWatchlist();
    await loadEvents();
  } catch (e) { fail('watchMsg', e); }
}
start();
</script>
</body>
</html>

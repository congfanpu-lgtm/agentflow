server:
  port: 8080
spring:
  application:
    name: agentflow-server
  datasource:
    url: jdbc:mysql://localhost:3306/agentflow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: agentflow123
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: agentflow-server-result-consumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.agentflow.common.mq,com.agentflow.common.trace
  data:
    mongodb:
      uri: mongodb://localhost:27017/agentflow_trace
    redis:
      host: localhost
      port: 6379
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

# 课程录播(课程库页 / 单讲页的接口)。默认关闭:公开 demo 用的也是这份代码,不能让路人触发下载和转写
agentflow:
  course:
    enabled: false
# 媒体服务(agentflow-media):逐字稿、帧列表、帧图片从这里转给页面
media:
  base-url: ${MEDIA_BASEURL:http://localhost:8010}
